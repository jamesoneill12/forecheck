# Job dir must contain data/external/agentdojo/agentdojo.jsonl from `forecheck external agentdojo`.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "eval-agentdojo"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    test -f data/external/agentdojo/agentdojo.jsonl &&
    D=/opt/ml/fsx/forecheck/data/agentdojo && mkdir -p $D && cp data/external/agentdojo/agentdojo.jsonl $D/ &&
    R=/opt/ml/fsx/forecheck/runs &&
    forecheck evaluate --backend rule_baseline --run $R/2b-synthetic-v4 --data $D --split agentdojo --class external_or_human --threshold-split none --out $R/2b-synthetic-v4/reports/rule_baseline/agentdojo &&
    forecheck evaluate --run $R/2b-synthetic-v4 --data $D --split agentdojo --class external_or_human --threshold-split none --out $R/2b-synthetic-v4/reports/agentdojo &&
    forecheck evaluate --run $R/2b-synthetic-v4 --data $D --split agentdojo --class external_or_human --threshold-split none --strip-identity --out $R/2b-synthetic-v4/reports/agentdojo-noid &&
    forecheck evaluate --run $R/2b-synthetic-v4-noid --data $D --split agentdojo --class external_or_human --threshold-split none --strip-identity --out $R/2b-synthetic-v4-noid/reports/agentdojo &&
    forecheck evaluate --run $R/8b-synthetic-v4 --data $D --split agentdojo --class external_or_human --threshold-split none --out $R/8b-synthetic-v4/reports/agentdojo &&
    forecheck evaluate --backend guardian --backend-config configs/baselines/granite-guardian-3.3-8b.yaml --run $R/baselines/granite-guardian-3.3-8b --data $D --split agentdojo --class external_or_human --threshold-split none --max-examples 1000 --out $R/baselines/granite-guardian-3.3-8b/reports/agentdojo &&
    forecheck evaluate --backend agent_self --backend-config configs/baselines/agent-self-granite-8b.yaml --run $R/baselines/agent-self-8b --data $D --split agentdojo --class external_or_human --threshold-split none --max-examples 1000 --out $R/baselines/agent-self-8b/reports/agentdojo'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
