# NOT LAUNCHED: needs explicit approval; submission command in configs/eks/README.md
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "train-8b-lora-nimble-parity-v2"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    forecheck data generate --offline --config configs/data/train_medium.yaml --out /opt/ml/fsx/forecheck/data/v2 &&
    forecheck data split /opt/ml/fsx/forecheck/data/v2 &&
    forecheck train --config configs/training/8b.yaml data.dir=/opt/ml/fsx/forecheck/data/v2 output.dir=/opt/ml/fsx/forecheck/runs/8b-synthetic-v2 tracking.backend=local &&
    forecheck calibrate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v2 --split calibration &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v2 --split test --class synthetic_in_distribution &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v2 --split heldout_family --class synthetic_heldout_adversarial &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v2 --split test --class synthetic_in_distribution --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v2/reports/rule_baseline/test &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v2 --split heldout_family --class synthetic_heldout_adversarial --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v2/reports/rule_baseline/heldout_family'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 6
