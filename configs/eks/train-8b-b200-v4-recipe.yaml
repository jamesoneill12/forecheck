# Granite-3.3-8B-instruct LoRA on v4 data: size control for the Guardian-8B arm; guards on data/v4 existing.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "train-8b-lora-synthetic-v4"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    test -f /opt/ml/fsx/forecheck/data/v4/train.jsonl &&
    forecheck train --config configs/training/8b.yaml data.dir=/opt/ml/fsx/forecheck/data/v4 output.dir=/opt/ml/fsx/forecheck/runs/8b-synthetic-v4 tracking.backend=local &&
    forecheck calibrate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split calibration &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split test --class synthetic_in_distribution &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split heldout_family --class synthetic_heldout_adversarial --approval-curve balanced &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split heldout_policy_kind --class synthetic_heldout_adversarial &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split heldout_policy_phrasing --class synthetic_heldout_adversarial &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split test --class synthetic_in_distribution --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v4/reports/rule_baseline/test &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v4 --split heldout_family --class synthetic_heldout_adversarial --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v4/reports/rule_baseline/heldout_family'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
