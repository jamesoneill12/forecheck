# Job dir must contain data/external/injecagent-v2/injecagent.jsonl (4-way control groups).
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "eval-injecagent-controls"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    test -f data/external/injecagent-v2/injecagent.jsonl &&
    D=/opt/ml/fsx/forecheck/data/injecagent-v2 && mkdir -p $D && cp data/external/injecagent-v2/injecagent.jsonl $D/injecagent.jsonl &&
    R=/opt/ml/fsx/forecheck/runs &&
    forecheck evaluate --run $R/2b-synthetic-v6 --data $D --split injecagent --class external_or_human --threshold-split none --dump-scores --out $R/2b-synthetic-v6/reports/injecagent-controls &&
    forecheck evaluate --run $R/8b-synthetic-v6 --data $D --split injecagent --class external_or_human --threshold-split none --dump-scores --out $R/8b-synthetic-v6/reports/injecagent-controls &&
    forecheck evaluate --run $R/8b-synthetic-v6 --data $D --split injecagent --class external_or_human --threshold-split none --strip-identity --dump-scores --out $R/8b-synthetic-v6/reports/injecagent-controls-noid &&
    forecheck evaluate --run $R/2b-synthetic-v4 --data $D --split injecagent --class external_or_human --threshold-split none --dump-scores --out $R/2b-synthetic-v4/reports/injecagent-controls'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
