# Four-suite AgentDojo eval, part B (8B stripped, Guardian, agent-self). Job dir must contain data/external/agentdojo/agentdojo-all.jsonl.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "eval-agentdojo-all-b"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    D=/opt/ml/fsx/forecheck/data/agentdojo-all && mkdir -p $D && cp data/external/agentdojo/agentdojo-all.jsonl $D/agentdojo.jsonl &&
    R=/opt/ml/fsx/forecheck/runs &&
    forecheck evaluate --run $R/8b-synthetic-v4 --data $D --split agentdojo --class external_or_human --threshold-split none --strip-identity --dump-scores --out $R/8b-synthetic-v4/reports/agentdojo-all-noid &&
    forecheck evaluate --backend guardian --backend-config configs/baselines/granite-guardian-3.3-8b.yaml --run $R/baselines/granite-guardian-3.3-8b --data $D --split agentdojo --class external_or_human --threshold-split none --max-examples 2000 --dump-scores --out $R/baselines/granite-guardian-3.3-8b/reports/agentdojo-all &&
    forecheck evaluate --backend agent_self --backend-config configs/baselines/agent-self-granite-8b.yaml --run $R/baselines/agent-self-8b --data $D --split agentdojo --class external_or_human --threshold-split none --max-examples 2000 --dump-scores --out $R/baselines/agent-self-8b/reports/agentdojo-all'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
