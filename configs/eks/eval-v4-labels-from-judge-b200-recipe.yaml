# Score the v4 2B checker against independent LLM-judge labels (docs/results/judge/v4-labels-gpt56.jsonl)
# instead of generator labels; the judged rows come from heldout_family, heldout_policy_kind and test.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "eval-v4-labels-from-judge"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    test -f docs/results/judge/v4-labels-gpt56.jsonl &&
    for split in heldout_family heldout_policy_kind test; do
      cls=synthetic_heldout_adversarial; [ "$split" = test ] && cls=synthetic_in_distribution;
      forecheck evaluate --run /opt/ml/fsx/forecheck/runs/2b-synthetic-v4 --split $split --class $cls --threshold-split none --labels-from docs/results/judge/v4-labels-gpt56.jsonl --out /opt/ml/fsx/forecheck/runs/2b-synthetic-v4/reports/${split}-judge &&
      forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/2b-synthetic-v4 --split $split --class $cls --threshold-split none --labels-from docs/results/judge/v4-labels-gpt56.jsonl --out /opt/ml/fsx/forecheck/runs/2b-synthetic-v4/reports/rule_baseline/${split}-judge;
    done'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
