# v6 = v4 config regenerated with renderer 2.0.0 (injection label leak fix, docs/results/notes/injection-label-leak-diagnosis.md); ends with the AgentDojo banking eval.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "train-8b-lora-synthetic-v6"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[train]" &&
    if [ ! -f /opt/ml/fsx/forecheck/data/v6/train.jsonl ]; then forecheck data generate --offline --config configs/data/train_medium.yaml --out /opt/ml/fsx/forecheck/data/v6 && forecheck data split /opt/ml/fsx/forecheck/data/v6 && python scripts/check_no_leakage.py /opt/ml/fsx/forecheck/data/v6; fi &&
    forecheck train --config configs/training/8b.yaml data.dir=/opt/ml/fsx/forecheck/data/v6 output.dir=/opt/ml/fsx/forecheck/runs/8b-synthetic-v6 tracking.backend=local &&
    forecheck calibrate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split calibration &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split test --class synthetic_in_distribution --approval-curve balanced &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split heldout_family --class synthetic_heldout_adversarial --approval-curve balanced &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split heldout_policy_kind --class synthetic_heldout_adversarial &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split heldout_policy_phrasing --class synthetic_heldout_adversarial &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split test --class synthetic_in_distribution --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v6/reports/rule_baseline/test &&
    forecheck evaluate --backend rule_baseline --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --split heldout_family --class synthetic_heldout_adversarial --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v6/reports/rule_baseline/heldout_family &&
    A=/opt/ml/fsx/forecheck/data/agentdojo && test -f $A/agentdojo.jsonl &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --data $A --split agentdojo --class external_or_human --threshold-split none --dump-scores --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v6/reports/agentdojo &&
    forecheck evaluate --run /opt/ml/fsx/forecheck/runs/8b-synthetic-v6 --data $A --split agentdojo --class external_or_human --threshold-split none --strip-identity --dump-scores --out /opt/ml/fsx/forecheck/runs/8b-synthetic-v6/reports/agentdojo-noid'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
