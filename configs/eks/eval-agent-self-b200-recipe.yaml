# Fin-style agent self-judgment baseline; see docs/evaluation/agent-self-judgment.md and configs/eks/README.md.
trainer:
  runtime_name: "torch-runtime"
  project_name: "forecheck"
  experiment_name: "eval-agent-self-baselines"

  ecr_image: "812836555640.dkr.ecr.us-east-2.amazonaws.com/ai/fin-base-training:latest"

  command: >-
    bash -c 'set -euo pipefail &&
    cd /workspace/forecheck-job &&
    pip install -q --no-cache-dir -e ".[torch]" &&
    test -f /opt/ml/fsx/forecheck/data/v3/train.jsonl &&
    for size in 2b 8b; do
      for split in heldout_family adversarial; do
        cls=synthetic_heldout_adversarial;
        forecheck evaluate --backend agent_self --backend-config configs/baselines/agent-self-granite-${size}.yaml --run /opt/ml/fsx/forecheck/runs/baselines/agent-self-${size} --data /opt/ml/fsx/forecheck/data/v3 --split $split --class $cls --threshold-split none --max-examples 2000 --out /opt/ml/fsx/forecheck/runs/baselines/agent-self-${size}/reports/${split} &&
        forecheck evaluate --backend agent_self --backend-config configs/baselines/agent-self-granite-${size}.yaml --run /opt/ml/fsx/forecheck/runs/baselines/agent-self-${size} --data /opt/ml/fsx/forecheck/data/v3 --split $split --class $cls --threshold-split none --max-examples 2000 --strip-identity --out /opt/ml/fsx/forecheck/runs/baselines/agent-self-${size}/reports/${split}-noid;
      done;
    done'

  env_vars:
    FORECHECK_TRACKING_BACKEND: "local"
    HF_HOME: "/opt/ml/fsx/forecheck/hf_cache"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  nnodes: 1

  resources:
    worker:
      instance_type: ml.p6-b200.48xlarge
      gpus_per_pod: 1
      cpus_per_pod: 2
