model:
  # Placeholder: confirm the licence in configs/training/README.md before replacing this id.
  base_id: REPLACE_WITH_APPROVED_8B_BASE_MODEL
  dtype: bf16
  attn_implementation: sdpa

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  qlora: false

data:
  dir: /opt/ml/fsx/forecheck/data/v1
  train_split: train
  dev_split: dev
  max_prompt_tokens: 8192
  dimension_weights: {}

optim:
  lr: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.03
  epochs: 2
  micro_batch_size: 4
  grad_accum: 4
  grad_clip: 1.0
  scheduler: cosine

train:
  seed: 0
  eval_every: 200
  save_every: 200
  early_stop_patience: 5
  shared_prefill: true

tracking:
  backend: local
  run_name: train-8b

output:
  dir: /opt/ml/fsx/forecheck/runs/8b-synthetic-v1
