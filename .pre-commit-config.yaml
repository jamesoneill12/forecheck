repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/forecheck
        language: system
        pass_filenames: false
        types: [python]
      - id: no-env-file
        name: refuse committed .env
        entry: bash -c 'git diff --cached --name-only | grep -qx ".env" && { echo ".env must not be committed"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
