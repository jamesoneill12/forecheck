# balanced: default ALLOW at higher thresholds; see policies/README.md for rationale.
bundle_id: balanced
version: 1
dsl_version: "1.0"
description: >
  Default-ALLOW bundle for tenants with established calibration confidence. Same eight
  deny categories as conservative, at higher thresholds; more REVIEW outcomes than
  permissive; reversible development-stage actions allow freely via an override.
default_decision: allow
uncalibrated_decision: review
allow_uncalibrated: false
unknown_as: worst_case
rules:
  - id: injection_drives_mutation
    description: >
      An action influenced by untrusted content that also mutates state.
    decision: deny
    hard: true
    when:
      all:
        - score: prompt_injection_influence
          gte: 0.65
        - fact: operation_is_mutating
          is: true
    obligations: [log_to_audit_sink, require_human_approval]

  - id: injection_drives_external_communication
    description: >
      An action influenced by untrusted content that also communicates externally.
    decision: deny
    hard: true
    when:
      all:
        - score: prompt_injection_influence
          gte: 0.65
        - score: external_communication
          gte: 0.6
    obligations: [log_to_audit_sink, require_human_approval]

  - id: exfiltration_confidential_to_untrusted_destination
    description: >
      Confidential-or-above data moving to an external or lookalike destination.
    decision: deny
    hard: true
    when:
      all:
        - score: sensitive_data_exposure
          gte: 0.6
        - fact: max_sensitivity
          in: [confidential, restricted, secret]
        - fact: destination_relationship
          in: [unknown_external, lookalike]
    obligations: [log_to_audit_sink, notify_resource_owner]

  - id: privilege_escalation_without_authorization
    description: >
      An action that grants or acquires authority without explicit authorization.
    decision: deny
    hard: true
    when:
      all:
        - score: privilege_escalation
          gte: 0.6
        - fact: authorization_explicit
          is: false
    obligations: [log_to_audit_sink, require_step_up_auth]

  - id: destructive_production_change_freeze
    description: >
      A destructive or irreversible production action while a change freeze is active.
    decision: deny
    hard: true
    when:
      all:
        - score: destructive_or_irreversible_action
          gte: 0.6
        - fact: stage
          is: production
        - fact: change_freeze
          is: true
    obligations: [log_to_audit_sink]

  - id: unauthorized_scope_and_no_delegated_scope
    description: >
      A high-confidence unauthorized-scope action by an agent with no delegated scope
      at all for this class of tool.
    decision: deny
    hard: true
    when:
      all:
        - score: unauthorized_scope
          gte: 0.6
        - fact: agent_has_scope_for_tool
          is: false
    obligations: [log_to_audit_sink, require_step_up_auth]

  - id: financial_commitment_unauthorized
    description: >
      A material financial commitment with no explicit authorization.
    decision: deny
    hard: true
    when:
      all:
        - score: financial_commitment
          gte: 0.5
        - fact: financial_amount
          gte: 1000
        - fact: authorization_explicit
          is: false
    obligations: [log_to_audit_sink, require_human_approval]

  - id: attack_shaped_sequence
    description: >
      The trajectory as a whole forms a recognisable attack shape.
    decision: deny
    hard: true
    when:
      score: suspicious_action_sequence
      gte: 0.7
    obligations: [log_to_audit_sink, require_human_approval]

  - id: review_injection_medium
    description: "Meaningful injection influence present, below the deny threshold."
    decision: review
    when:
      score: prompt_injection_influence
      gte: 0.35
    obligations: [log_to_audit_sink]

  - id: review_sensitive_exposure_medium
    description: "Meaningful sensitive data exposure risk present."
    decision: review
    when:
      score: sensitive_data_exposure
      gte: 0.4
    obligations: [log_to_audit_sink]

  - id: review_untrusted_destination_medium
    description: "Destination trust is meaningfully questionable."
    decision: review
    when:
      score: untrusted_destination
      gte: 0.45
    obligations: [log_to_audit_sink]

  - id: review_privilege_escalation_medium
    description: "Meaningful privilege escalation risk, below the deny threshold."
    decision: review
    when:
      score: privilege_escalation
      gte: 0.35
    obligations: [log_to_audit_sink]

  - id: review_destructive_action_medium
    description: "Meaningful destructive/irreversible risk, below the deny threshold."
    decision: review
    when:
      score: destructive_or_irreversible_action
      gte: 0.4
    obligations: [log_to_audit_sink]

  - id: review_financial_commitment_medium
    description: "Meaningful financial commitment risk, below the deny threshold."
    decision: review
    when:
      score: financial_commitment
      gte: 0.35
    obligations: [log_to_audit_sink]

  - id: review_policy_conflict
    description: "The action conflicts with a supplied organizational policy."
    decision: review
    when:
      score: policy_conflict
      gte: 0.5
    obligations: [log_to_audit_sink]

  - id: review_insufficient_context
    description: >
      The model could not determine the other dimensions from the supplied context.
    decision: review
    when:
      score: insufficient_context
      gte: 0.6
    obligations: [log_to_audit_sink]

  - id: review_missing_mfa_for_sensitive_resource
    description: >
      A restricted-or-secret resource is touched without a satisfied MFA challenge.
    decision: review
    when:
      all:
        - fact: max_sensitivity
          in: [restricted, secret]
        - fact: mfa_satisfied
          is: false
    obligations: [log_to_audit_sink, require_step_up_auth]

  - id: allow_reversible_dev_action
    description: >
      Reversible development-stage actions with no untrusted content in play allow
      freely, even if a lower-severity review signal is also present.
    decision: allow
    kind: allow_override
    when:
      all:
        - fact: stage
          is: development
        - fact: operation_is_mutating
          is: false
        - fact: has_untrusted_content
          is: false
    obligations: [log_to_audit_sink]
