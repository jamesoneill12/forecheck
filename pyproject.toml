[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forecheck"
version = "0.1.0"
description = "A calibrated pre-execution risk model for AI-agent actions."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "forecheck contributors" }]
keywords = [
  "ai-agents",
  "tool-calling",
  "prompt-injection",
  "risk-classification",
  "calibration",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "structlog>=24.1,<26",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Local inference / training with a real Hugging Face backbone.
torch = [
  "torch>=2.4",
  "transformers>=4.57",
  "accelerate>=0.33",
]
train = [
  "forecheck[torch]",
  "peft>=0.12",
  "datasets>=2.20",
  "safetensors>=0.4",
]
# Optional 4-bit QLoRA path (CUDA only).
quant = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
# LLM renderers for synthetic data generation. Offline fixture mode needs none of these.
gen = [
  "anthropic>=0.34",
  "openai>=1.40",
]
otel = [
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/jamesoneill12/forecheck"
Repository = "https://github.com/jamesoneill12/forecheck"
Issues = "https://github.com/jamesoneill12/forecheck/issues"

[project.scripts]
forecheck = "forecheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forecheck"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "forecheck/_bundles"

[tool.hatch.build.targets.sdist]
include = ["src/forecheck", "configs", "policies", "tests", "README.md", "LICENSE", "NOTICE"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                 # isort
  "UP",                # pyupgrade
  "B",                 # bugbear
  "C4",                # comprehensions
  "SIM",               # simplify
  "RUF",               # ruff-specific
  "S",                 # bandit (security)
  "ANN",               # annotations
  "PTH",               # pathlib
  "TID",               # tidy imports
]
ignore = [
  "ANN401",  # allow Any in narrow adapter boundaries
  "S101",    # assert is fine in tests; narrowed below for src
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S105", "S106", "S311"]
"scripts/**" = ["S603", "S607", "ANN"]
"examples/**" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["forecheck"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/forecheck"]
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "scipy.*",
  "transformers.*",
  "peft.*",
  "datasets.*",
  "bitsandbytes.*",
  "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "slow: takes more than a few seconds",
  "gpu: requires a CUDA or MPS device",
  "network: requires outbound network access (excluded from default CI)",
  "api_key: requires a third-party API key from the environment",
]
filterwarnings = ["error::DeprecationWarning:forecheck.*"]

[tool.coverage.run]
source = ["src/forecheck"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
